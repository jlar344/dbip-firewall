---
- name: Require at least one forward destination
  ansible.builtin.assert:
    that:
      - dbip_forward_destinations | length > 0
    fail_msg: "Set dbip_forward_destinations in inventory (host:port list)."

- name: Deploy sshd Match drop-in for prod_*
  ansible.builtin.template:
    src: sshd-dbip.conf.j2
    dest: "{{ dbip_sshd_dropin_path }}"
    owner: root
    group: root
    mode: "0644"
    validate: "/usr/sbin/sshd -t -f /etc/ssh/sshd_config"
  notify: Reload sshd
